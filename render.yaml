services:
  - type: web
    name: fintrack-pro
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: fintrack-data
      mountPath: /app/data
      sizeGB: 1
